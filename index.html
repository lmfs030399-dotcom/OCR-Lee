<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu OCR - Scanner & Tradutor</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cropper.js (Para recorte da imagem) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

    <style>
        /* =========================================
           CSS - INTERFACE E RESPONSIVIDADE
           ========================================= */
        :root {
            --bg-color: #121212;
            --primary: #007bff;
            --primary-dark: #0056b3;
            --text-light: #ffffff;
            --surface: #1e1e1e;
            --danger: #dc3545;
            --success: #28a745;
            --secondary: #6c757d;
            --warning: #ffc107;
            --purple: #8b5cf6;
            --red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .hidden { display: none !important; }

        /* HEADER */
        header {
            padding: 15px; text-align: center; background: rgba(0, 0, 0, 0.8);
            position: absolute; top: 0; width: 100%; z-index: 10;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h3 { font-family: 'Fredoka', sans-serif; font-size: 18px; margin-left: 10px; color: var(--primary);}
        
        .lang-select-camera {
            background: #333; color: white; border: 1px solid #555; padding: 6px;
            border-radius: 5px; font-size: 13px; margin-right: 10px; outline: none;
            max-width: 150px;
        }

        /* SCREENS */
        .screen {
            flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; background: var(--bg-color);
        }

        /* 1. TELA DE CÂMERA */
        #camera-screen video { width: 100%; height: 100%; object-fit: cover; }
        .camera-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none; background: rgba(0,0,0,0.2);
        }
        .frame {
            width: 85%; height: 60%; border: 2px dashed rgba(255, 255, 255, 0.8);
            border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); position: relative;
        }
        .frame::after {
            content: 'Posicione o texto aqui'; position: absolute; top: -30px; left: 0;
            width: 100%; text-align: center; font-size: 14px; font-weight: 600;
        }
        .camera-controls {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: space-evenly; align-items: center; z-index: 20;
        }
        .btn-capture {
            width: 75px; height: 75px; border-radius: 50%; background: white;
            border: 4px solid #ddd; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-capture:active { transform: scale(0.95); background: #eee; }
        
        .btn-icon {
            background: rgba(0,0,0,0.7); color: white; border: none;
            width: 55px; height: 55px; border-radius: 50%; font-size: 20px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; transition: 0.2s;
        }
        .btn-icon:active { transform: scale(0.9); }
        .btn-icon.purple { background: var(--purple); }

        /* 2. TELA DE RECORTE (CROPPER) */
        #cropper-screen { padding-top: 60px; display: flex; flex-direction: column; }
        .cropper-container-wrapper { flex: 1; width: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .cropper-container-wrapper img { max-width: 100%; max-height: 100%; display: block; }
        .cropper-actions { padding: 20px; display: flex; gap: 10px; background: #1a1a1a; }

        /* 3. TELA DE PROCESSAMENTO */
        #processing-screen { justify-content: center; align-items: center; z-index: 30; }
        .loader {
            border: 5px solid #333; border-top: 5px solid var(--primary);
            border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .progress-container { width: 80%; background: #333; border-radius: 10px; margin-top: 20px; overflow: hidden; height: 12px;}
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }

        /* 4. TELA DE RESULTADOS */
        #result-screen { padding: 60px 15px 20px 15px; z-index: 40; overflow-y: auto; }
        
        /* Sistema de Abas */
        .tabs { display: flex; background: #2a2a2a; border-radius: 10px; padding: 5px; margin-bottom: 15px; }
        .tab { flex: 1; text-align: center; padding: 10px; font-weight: 600; cursor: pointer; border-radius: 8px; color: var(--secondary); transition: 0.3s; font-size: 14px;}
        .tab.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        textarea {
            width: 100%; height: 200px; background: var(--surface); color: white;
            border: 1px solid #333; border-radius: 8px; padding: 15px;
            font-size: 15px; resize: none; margin-bottom: 5px; line-height: 1.6;
        }
        .stats { display: flex; justify-content: space-between; font-size: 12px; color: #888; margin-bottom: 15px; }
        
        .translate-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .translate-group select { flex: 1; padding: 12px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 8px; outline: none; font-size: 14px;}
        
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .btn {
            padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); }
        .btn-secondary { background: #333; border: 1px solid #444;}
        .btn-warning { background: var(--warning); color: #000;}
        .btn-purple { background: var(--purple); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-full { grid-column: span 2; }

        /* TELA DE ERRO */
        #error-screen { justify-content: center; align-items: center; padding: 20px; text-align: center; z-index: 50; }
        .error-icon { font-size: 50px; color: var(--danger); margin-bottom: 20px; }
        
        /* DITADO PULSANDO */
        .recording { animation: pulse-red 1.5s infinite; background: var(--danger) !important; color: white !important;}
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

    <header>
        <h3><i class="fa-solid fa-expand"></i> MEU OCR</h3>
        <!-- Códigos de idioma AMPLIADOS -->
        <select id="ocr-lang-select" class="lang-select-camera">
            <option value="por" selected>Ler: Português</option>
            <option value="eng">Ler: Inglês</option>
            <option value="spa">Ler: Espanhol</option>
            <option value="fre">Ler: Francês</option>
            <option value="ger">Ler: Alemão</option>
            <option value="ita">Ler: Italiano</option>
            <option value="jpn">Ler: Japonês</option>
            <option value="chs">Ler: Chinês</option>
            <option value="rus">Ler: Russo</option>
            <option value="ara">Ler: Árabe</option>
            <option value="kor">Ler: Coreano</option>
        </select>
    </header>

    <!-- 1. TELA DA CÂMERA -->
    <div id="camera-screen" class="screen">
        <video id="camera-video" autoplay playsinline></video>
        <div class="camera-overlay"><div class="frame"></div></div>
        
        <div class="camera-controls">
            <!-- Galeria -->
            <label for="gallery-input" class="btn-icon" style="cursor: pointer;" title="Abrir da Galeria">
                <i class="fa-regular fa-image"></i>
            </label>
            <input type="file" id="gallery-input" accept="image/*" style="position: absolute; opacity: 0; width: 1px; height: 1px; z-index: -1;">

            <!-- Botão de Captura -->
            <button id="btn-capture" class="btn-capture" title="Escanear Texto"></button>

            <!-- Botão de Transcrição por Voz (Home Screen) -->
            <button id="btn-home-dictate" class="btn-icon purple" title="Transcrever Fala">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <!-- Botão de Inverter Câmera -->
            <button id="btn-switch-cam" class="btn-icon"><i class="fa-solid fa-camera-rotate"></i></button>
            <button id="btn-flash" class="btn-icon hidden" style="position:absolute; top: -50px; right: 20px;"><i class="fa-solid fa-bolt"></i></button>
        </div>
        <canvas id="capture-canvas" class="hidden"></canvas>
    </div>

    <!-- 2. TELA DE RECORTE (CROPPER) -->
    <div id="cropper-screen" class="screen hidden">
        <div class="cropper-container-wrapper">
            <img id="image-to-crop" src="">
        </div>
        <div class="cropper-actions">
            <button class="btn btn-secondary" style="flex: 1;" onclick="AppState.set('CAMERA_READY')">Cancelar</button>
            <button class="btn btn-primary" style="flex: 2;" id="btn-process-crop"><i class="fa-solid fa-check"></i> Extrair Texto</button>
        </div>
    </div>

    <!-- 3. TELA DE PROCESSAMENTO -->
    <div id="processing-screen" class="screen hidden">
        <div class="loader"></div>
        <h2 id="process-status" style="font-size: 18px;">Analisando texto...</h2>
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
        <p id="progress-text" style="margin-top: 10px; font-size: 14px; color: #aaa;">0%</p>
    </div>

    <!-- 4. TELA DE RESULTADOS -->
    <div id="result-screen" class="screen hidden">
        
        <div class="tabs">
            <div class="tab active" id="tab-original" onclick="Tabs.switch('original')">Texto Original</div>
            <div class="tab" id="tab-traducao" onclick="Tabs.switch('traducao')">Tradução</div>
        </div>

        <textarea id="result-text-original" spellcheck="false" placeholder="Seu texto aparecerá aqui..."></textarea>
        <textarea id="result-text-traducao" spellcheck="false" class="hidden" placeholder="O texto traduzido aparecerá aqui..."></textarea>
        
        <div class="stats">
            <span id="text-stats">0 caracteres | 0 palavras</span>
        </div>
        
        <!-- Controles de Tradução -->
        <div class="translate-group" id="translate-controls">
            <select id="target-lang-select">
                <option value="pt" selected>Para: Português 🇧🇷</option>
                <option value="en">Para: Inglês 🇺🇸</option>
                <option value="es">Para: Espanhol 🇪🇸</option>
                <option value="fr">Para: Francês 🇫🇷</option>
                <option value="de">Para: Alemão 🇩🇪</option>
                <option value="it">Para: Italiano 🇮🇹</option>
                <option value="ja">Para: Japonês 🇯🇵</option>
                <option value="zh-CN">Para: Chinês 🇨🇳</option>
                <option value="ru">Para: Russo 🇷🇺</option>
                <option value="ar">Para: Árabe 🇸🇦</option>
                <option value="ko">Para: Coreano 🇰🇷</option>
            </select>
            <button id="btn-translate" class="btn btn-warning"><i class="fa-solid fa-language"></i> Traduzir</button>
        </div>

        <div class="actions-grid">
            <button id="btn-dictate" class="btn btn-secondary"><i class="fa-solid fa-microphone"></i> Ditar</button>
            <button id="btn-speak" class="btn btn-purple"><i class="fa-solid fa-volume-high"></i> Ouvir</button>
            <button id="btn-copy" class="btn btn-primary"><i class="fa-regular fa-copy"></i> Copiar</button>
            <button id="btn-share" class="btn btn-primary"><i class="fa-solid fa-share-nodes"></i> Compartilhar</button>
            <button id="btn-clear" class="btn btn-danger"><i class="fa-solid fa-trash"></i> Limpar</button>
            <button id="btn-download" class="btn btn-secondary"><i class="fa-solid fa-download"></i> Salvar TXT</button>
            <button id="btn-retake" class="btn btn-success btn-full"><i class="fa-solid fa-house"></i> Voltar ao Início</button>
        </div>
    </div>

    <!-- 5. TELA DE ERRO -->
    <div id="error-screen" class="screen hidden">
        <div class="error-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h2 id="error-title">Atenção</h2>
        <p id="error-msg" style="margin: 15px 0; color: #aaa; font-size: 14px;">Ocorreu um problema ao tentar acessar a câmera.</p>
        
        <div style="display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 250px; margin: 0 auto;">
            <label for="gallery-input-error" class="btn btn-primary" style="cursor: pointer;">
                <i class="fa-regular fa-image"></i> Escolher da Galeria
            </label>
            <input type="file" id="gallery-input-error" accept="image/*" style="position: absolute; opacity: 0; width: 1px; height: 1px; z-index: -1;">
            
            <button id="btn-retry" class="btn btn-secondary">Tentar Câmera Novamente</button>
        </div>
    </div>

    <script>
        // Carrega as vozes antecipadamente
        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };

        // PWA SETUP
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
        }

        let cropper = null;

        // MAPA DINÂMICO DE IDIOMAS
        const LanguageCodes = {
            ocrToSpeech: {
                'por': 'pt-BR', 'eng': 'en-US', 'spa': 'es-ES', 'fre': 'fr-FR', 
                'ger': 'de-DE', 'ita': 'it-IT', 'jpn': 'ja-JP', 'chs': 'zh-CN', 
                'rus': 'ru-RU', 'ara': 'ar-SA', 'kor': 'ko-KR'
            },
            translateToSpeech: {
                'pt': 'pt-BR', 'en': 'en-US', 'es': 'es-ES', 'fr': 'fr-FR', 
                'de': 'de-DE', 'it': 'it-IT', 'ja': 'ja-JP', 'zh-CN': 'zh-CN', 
                'ru': 'ru-RU', 'ar': 'ar-SA', 'ko': 'ko-KR'
            }
        };

        const AppState = {
            current: 'IDLE',
            set(state) {
                this.current = state;
                document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
                
                if (state === 'CAMERA_READY') {
                    document.getElementById('camera-screen').classList.remove('hidden');
                    document.querySelector('header').classList.remove('hidden');
                    window.speechSynthesis.cancel(); 
                    Dictation.stop();
                    Camera.start();
                } 
                else if (state === 'CROPPER') {
                    document.getElementById('cropper-screen').classList.remove('hidden');
                    document.querySelector('header').classList.add('hidden');
                }
                else if (state === 'PROCESSING') {
                    document.querySelector('header').classList.add('hidden');
                    document.getElementById('processing-screen').classList.remove('hidden');
                } 
                else if (state === 'RESULT') {
                    document.querySelector('header').classList.add('hidden');
                    document.getElementById('result-screen').classList.remove('hidden');
                } 
                else if (state === 'ERROR') {
                    document.querySelector('header').classList.add('hidden');
                    document.getElementById('error-screen').classList.remove('hidden');
                }
            }
        };

        const Camera = {
            videoElement: document.getElementById('camera-video'),
            stream: null,
            facingMode: 'environment',
            track: null,
            flashOn: false,

            async start() {
                this.stop(); 
                try {
                    const constraints = { video: { facingMode: this.facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } } };
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.videoElement.srcObject = this.stream;
                    this.track = this.stream.getVideoTracks()[0];

                    const capabilities = this.track.getCapabilities();
                    const btnFlash = document.getElementById('btn-flash');
                    if (capabilities && capabilities.torch) btnFlash.classList.remove('hidden');
                    else btnFlash.classList.add('hidden');
                } catch (err) {
                    document.getElementById('error-msg').innerText = "Verifique as permissões de câmera do navegador ou use a Galeria.";
                    AppState.set('ERROR');
                }
            },
            stop() {
                if (this.stream) this.stream.getTracks().forEach(t => t.stop());
                this.flashOn = false;
            },
            toggleCamera() {
                this.facingMode = this.facingMode === 'environment' ? 'user' : 'environment';
                this.start();
            },
            async toggleFlash() {
                if (!this.track) return;
                this.flashOn = !this.flashOn;
                try { await this.track.applyConstraints({ advanced: [{ torch: this.flashOn }] }); } 
                catch (e) {}
            }
        };

        const ImageProcessor = {
            canvas: document.getElementById('capture-canvas'),
            captureFrame(video) {
                const ctx = this.canvas.getContext('2d');
                this.canvas.width = video.videoWidth;
                this.canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, this.canvas.width, this.canvas.height);
                return this.canvas.toDataURL('image/jpeg', 0.9);
            },
            getCroppedBase64() {
                if(!cropper) return null;
                return cropper.getCroppedCanvas({
                    imageSmoothingEnabled: true,
                    imageSmoothingQuality: 'high'
                }).toDataURL('image/jpeg', 0.9);
            }
        };

        // --- API CLOUD (OCR.Space) ---
        const OCR = {
            recognize: async function(imageBase64, lang) {
                let pct = 10;
                const progressInterval = setInterval(() => {
                    pct = pct < 90 ? pct + 10 : pct;
                    document.getElementById('progress-bar').style.width = `${pct}%`;
                    document.getElementById('progress-text').innerText = `${pct}%`;
                }, 400);

                try {
                    const formData = new FormData();
                    formData.append("base64Image", imageBase64);
                    formData.append("language", lang);
                    formData.append("apikey", "helloworld"); 
                    formData.append("isOverlayRequired", "false");
                    formData.append("scale", "true"); 
                    formData.append("OCREngine", "1"); 

                    const response = await fetch("https://api.ocr.space/parse/image", {
                        method: "POST",
                        body: formData
                    });

                    clearInterval(progressInterval);
                    document.getElementById('progress-bar').style.width = `100%`;
                    document.getElementById('progress-text').innerText = `100%`;

                    const json = await response.json();

                    if (json.IsErroredOnProcessing) {
                        throw new Error("Erro na API.");
                    }

                    let extractedText = "";
                    if (json.ParsedResults && json.ParsedResults.length > 0) {
                        extractedText = json.ParsedResults[0].ParsedText;
                    }

                    return this.cleanText(extractedText);

                } catch (error) {
                    clearInterval(progressInterval);
                    throw error;
                }
            },
            
            cleanText(text) {
                if (!text) return "";
                let cleaned = text;
                cleaned = cleaned.replace(/[|~^\\_§©®™=*+`]/g, '');
                cleaned = cleaned.replace(/([a-zA-Zá-úÁ-Ú])-[\s]*\r?\n[\s]*([a-zA-Zá-úÁ-Ú])/g, '$1$2');
                cleaned = cleaned.replace(/(\r?\n){2,}/g, '[[PARAGRAFO]]');
                cleaned = cleaned.replace(/\r?\n/g, ' ');
                cleaned = cleaned.replace(/\[\[PARAGRAFO\]\]/g, '\n\n');
                cleaned = cleaned.replace(/ {2,}/g, ' ');
                return cleaned.trim();
            }
        };

        const Dictation = {
            recognition: null,
            isRecording: false,
            lastTranscript: '',
            lastTime: 0,
            
            init() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return false;
                
                this.recognition = new SpeechRecognition();
                this.recognition.continuous = true;
                this.recognition.interimResults = false; 
                
                this.recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    
                    let transcript = finalTranscript.trim();
                    
                    if (transcript) {
                        let now = Date.now();
                        if (this.lastTranscript === transcript && (now - this.lastTime) < 1500) return; 
                        this.lastTranscript = transcript;
                        this.lastTime = now;

                        const textArea = Tabs.active === 'original' ? document.getElementById('result-text-original') : document.getElementById('result-text-traducao');
                        let currentVal = textArea.value;
                        
                        if (currentVal.length > 0 && !currentVal.endsWith(' ') && !currentVal.endsWith('\n')) {
                            currentVal += ' ';
                        }
                        if (currentVal.length === 0) {
                            transcript = transcript.charAt(0).toUpperCase() + transcript.slice(1);
                        }
                        
                        textArea.value = currentVal + transcript + ' ';
                        Actions.updateStats();
                    }
                };
                
                this.recognition.onerror = (event) => {
                    if (event.error !== 'no-speech') this.stop();
                };
                
                this.recognition.onend = () => {
                    if(this.isRecording) setTimeout(() => { if(this.isRecording) this.recognition.start(); }, 250);
                };
                return true;
            },
            toggle() {
                if (!this.recognition && !this.init()) {
                    alert("Seu navegador não suporta digitação por voz. Tente usar o Google Chrome ou Safari.");
                    return;
                }
                
                const btn = document.getElementById('btn-dictate');
                if (this.isRecording) {
                    this.stop();
                } else {
                    if (Tabs.active === 'original') {
                        const ocrCode = document.getElementById('ocr-lang-select').value;
                        this.recognition.lang = LanguageCodes.ocrToSpeech[ocrCode] || 'pt-BR';
                    } else {
                        const targetCode = document.getElementById('target-lang-select').value;
                        this.recognition.lang = LanguageCodes.translateToSpeech[targetCode] || 'pt-BR';
                    }

                    this.isRecording = true;
                    this.lastTranscript = ''; 
                    this.recognition.start();
                    btn.innerHTML = '<i class="fa-solid fa-stop"></i> Parar Ditado';
                    btn.classList.add('recording');
                }
            },
            stop() {
                if(this.recognition) {
                    this.isRecording = false;
                    this.recognition.stop();
                    const btn = document.getElementById('btn-dictate');
                    btn.innerHTML = '<i class="fa-solid fa-microphone"></i> Ditar';
                    btn.classList.remove('recording');
                }
            }
        };

        const Tabs = {
            active: 'original',
            switch(tabName) {
                this.active = tabName;
                document.getElementById('tab-original').classList.remove('active');
                document.getElementById('tab-traducao').classList.remove('active');
                document.getElementById('result-text-original').classList.add('hidden');
                document.getElementById('result-text-traducao').classList.add('hidden');

                document.getElementById(`tab-${tabName}`).classList.add('active');
                document.getElementById(`result-text-${tabName}`).classList.remove('hidden');

                if(tabName === 'original') {
                    document.getElementById('translate-controls').classList.remove('hidden');
                } else {
                    document.getElementById('translate-controls').classList.add('hidden');
                }
                
                Actions.updateStats();
                window.speechSynthesis.cancel();
                Dictation.stop();
            }
        };

        const Actions = {
            async copy() {
                const text = Tabs.active === 'original' ? document.getElementById('result-text-original').value : document.getElementById('result-text-traducao').value;
                try {
                    await navigator.clipboard.writeText(text);
                    const btn = document.getElementById('btn-copy');
                    btn.innerHTML = "<i class='fa-solid fa-check'></i> Copiado";
                    setTimeout(() => btn.innerHTML = "<i class='fa-regular fa-copy'></i> Copiar", 2000);
                } catch (err) { alert("Erro ao copiar."); }
            },
            async share() {
                const text = Tabs.active === 'original' ? document.getElementById('result-text-original').value : document.getElementById('result-text-traducao').value;
                if (navigator.share) {
                    try { await navigator.share({ title: 'Texto Extraído', text: text }); } catch (err) {}
                }
            },
            async translate() {
                const text = document.getElementById('result-text-original').value;
                if(!text || text.trim() === "") return alert("Não há texto original para traduzir!");

                const targetLang = document.getElementById('target-lang-select').value;
                const btn = document.getElementById('btn-translate');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>...';
                
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;

                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    const translatedText = data[0].map(item => item[0]).join('');
                    
                    document.getElementById('result-text-traducao').value = translatedText;
                    Tabs.switch('traducao');
                } catch (error) {
                    alert("Erro ao traduzir. Verifique a internet.");
                }
                btn.innerHTML = '<i class="fa-solid fa-language"></i> Traduzir';
            },
            
            // --- NOVO CAÇADOR DE VOZES PREMIUM ---
            getBestVoice(langCode) {
                const voices = window.speechSynthesis.getVoices();
                if (!voices || voices.length === 0) return null;

                const baseLang = langCode.split('-')[0];
                const langVoices = voices.filter(v => v.lang.startsWith(baseLang));
                if (langVoices.length === 0) return null;

                // Força a busca das vozes mais naturais em Português
                if (baseLang === 'pt') {
                    const vipVoices = ['Google português do Brasil', 'Luciana', 'Francisca Online', 'Raquel', 'Vitoria', 'Premium'];
                    for (let vip of vipVoices) {
                        const found = langVoices.find(v => v.name.includes(vip));
                        if (found) return found;
                    }
                }

                // Tenta achar qualquer voz premium para os outros idiomas
                let bestVoice = langVoices.find(v => 
                    v.name.includes('Google') || 
                    v.name.includes('Premium') || 
                    v.name.includes('Natural') || 
                    v.name.includes('Online') ||
                    v.name.includes('Enhanced')
                );

                if (!bestVoice) {
                    bestVoice = langVoices.find(v => v.lang === langCode) || langVoices[0];
                }

                return bestVoice;
            },

            speak() {
                window.speechSynthesis.cancel();
                const text = Tabs.active === 'original' ? document.getElementById('result-text-original').value : document.getElementById('result-text-traducao').value;
                if(!text) return;

                const utterance = new SpeechSynthesisUtterance(text);
                let targetLang = 'pt-BR';
                
                if (Tabs.active === 'traducao') {
                    const targetCode = document.getElementById('target-lang-select').value;
                    targetLang = LanguageCodes.translateToSpeech[targetCode] || 'pt-BR';
                } else {
                    const ocrCode = document.getElementById('ocr-lang-select').value;
                    targetLang = LanguageCodes.ocrToSpeech[ocrCode] || 'pt-BR';
                }
                
                utterance.lang = targetLang;
                
                // Aplica a voz de alta qualidade
                const bestVoice = this.getBestVoice(targetLang);
                if (bestVoice) {
                    utterance.voice = bestVoice;
                }
                
                // Deixa o ritmo de leitura mais parecido com o de um humano lendo um audiolivro
                utterance.rate = 0.88; 
                utterance.pitch = 1.0; 

                window.speechSynthesis.speak(utterance);
            },
            
            clear() {
                const textArea = Tabs.active === 'original' ? document.getElementById('result-text-original') : document.getElementById('result-text-traducao');
                if (textArea.value.trim() !== '') {
                    if (confirm("Tem certeza que deseja apagar todo o texto desta aba?")) {
                        textArea.value = '';
                        this.updateStats();
                    }
                }
            },
            downloadTXT() {
                const text = Tabs.active === 'original' ? document.getElementById('result-text-original').value : document.getElementById('result-text-traducao').value;
                if(!text) return;
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'Texto_Extraido.txt';
                link.click();
            },
            updateStats() {
                const text = Tabs.active === 'original' ? document.getElementById('result-text-original').value : document.getElementById('result-text-traducao').value;
                const chars = text.length;
                const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
                document.getElementById('text-stats').innerText = `${chars} caracteres | ${words} palavras`;
            }
        };

        // INICIALIZAÇÃO E EVENTOS
        document.addEventListener('DOMContentLoaded', () => {
            AppState.set('CAMERA_READY');
            if (!navigator.share) document.getElementById('btn-share').classList.add('hidden');

            document.getElementById('btn-capture').addEventListener('click', () => {
                const imageData = ImageProcessor.captureFrame(Camera.videoElement);
                Camera.stop();
                
                const imgElement = document.getElementById('image-to-crop');
                imgElement.src = imageData;
                
                AppState.set('CROPPER');
                
                if (cropper) cropper.destroy();
                cropper = new Cropper(imgElement, {
                    viewMode: 1, dragMode: 'crop', autoCropArea: 0.8, background: false
                });
            });

            document.getElementById('btn-home-dictate').addEventListener('click', () => {
                Camera.stop();
                document.getElementById('result-text-original').value = "";
                document.getElementById('result-text-traducao').value = "";
                Tabs.switch('original');
                AppState.set('RESULT');
                
                setTimeout(() => {
                    if (!Dictation.isRecording) {
                        Dictation.toggle();
                    }
                }, 300);
            });

            function handleImageUpload(e) {
                if (e.target.files && e.target.files.length > 0) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        Camera.stop(); 
                        const imgElement = document.getElementById('image-to-crop');
                        imgElement.src = event.target.result;
                        
                        AppState.set('CROPPER');
                        
                        if (cropper) cropper.destroy();
                        cropper = new Cropper(imgElement, {
                            viewMode: 1, dragMode: 'crop', autoCropArea: 0.8, background: false
                        });
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
                e.target.value = ''; 
            }

            document.getElementById('gallery-input').addEventListener('change', handleImageUpload);
            document.getElementById('gallery-input-error').addEventListener('change', handleImageUpload);

            document.getElementById('btn-process-crop').addEventListener('click', async () => {
                AppState.set('PROCESSING');
                
                const imageBase64 = ImageProcessor.getCroppedBase64();
                const selectedOcrLang = document.getElementById('ocr-lang-select').value;

                try {
                    const text = await OCR.recognize(imageBase64, selectedOcrLang);
                    if (text.length < 2) {
                        document.getElementById('error-msg').innerText = "Não conseguimos identificar texto legível. A imagem pode estar embaçada.";
                        AppState.set('ERROR');
                        return;
                    }
                    
                    document.getElementById('result-text-original').value = text;
                    document.getElementById('result-text-traducao').value = ""; 
                    Tabs.switch('original');
                    AppState.set('RESULT');
                } catch (error) {
                    document.getElementById('error-msg').innerText = "Ocorreu um erro ao conectar com o motor de leitura. Tente novamente.";
                    AppState.set('ERROR');
                }
            });

            document.getElementById('btn-switch-cam').addEventListener('click', () => Camera.toggleCamera());
            document.getElementById('btn-flash').addEventListener('click', () => Camera.toggleFlash());
            
            document.getElementById('btn-retake').addEventListener('click', () => {
                document.getElementById('progress-bar').style.width = '0%';
                document.getElementById('progress-text').innerText = '0%';
                AppState.set('CAMERA_READY');
            });
            document.getElementById('btn-retry').addEventListener('click', () => AppState.set('CAMERA_READY'));

            document.getElementById('btn-copy').addEventListener('click', () => Actions.copy());
            document.getElementById('btn-share').addEventListener('click', () => Actions.share());
            document.getElementById('btn-translate').addEventListener('click', () => Actions.translate());
            document.getElementById('btn-speak').addEventListener('click', () => Actions.speak());
            document.getElementById('btn-clear').addEventListener('click', () => Actions.clear());
            document.getElementById('btn-download').addEventListener('click', () => Actions.downloadTXT());
            document.getElementById('btn-dictate').addEventListener('click', () => Dictation.toggle());

            document.getElementById('result-text-original').addEventListener('input', () => Actions.updateStats());
            document.getElementById('result-text-traducao').addEventListener('input', () => Actions.updateStats());
        });
    </script>
</body>
</html>
